# Render Blueprint for the backend (optional: you can also create the service in the dashboard)
services:
  - type: web
    name: lyftr-chatbot-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: LLM_MODELS
        value: gemini/gemini-3.5-flash-lite,gemini/gemini-3.1-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: CACHE_TYPE
        value: disk
