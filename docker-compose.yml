services:
  backend:
    build:
      context: ./backend
    container_name: lyftr-backend
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.8-flash}
      LLM_MODELS: ${LLM_MODELS:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      CACHE_TYPE: ${CACHE_TYPE:-disk}
      MOCK_LLM: ${MOCK_LLM:-false}
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: lyftr-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
